{{ $code := .Inner | strings.TrimSpace }}
{{ $height := .Get "height" | default "180" }}
{{ $srcDoc := printf "<!doctype html><html><head><meta charset='utf-8'><style>:root{--ds-bg:#fff;--ds-surface:#f0ebff;--ds-surface-alt:#ede9fe;--ds-border:#e4deff;--ds-muted:#6b7280;--ds-text:#1e1b4b}*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:1rem;background:var(--ds-bg);color:var(--ds-text)}</style></head><body>%s</body></html>" $code }}
<div class="demo-block">
  <div class="demo-preview">
    <iframe
      srcdoc="{{ $srcDoc }}"
      frameborder="0"
      class="demo-iframe"
      style="height:{{ $height }}px"
      loading="lazy"
    ></iframe>
  </div>
  <details class="demo-source">
    <summary>View code</summary>
    {{ highlight $code "html" "" }}
  </details>
</div>
