{{ $code := .Inner | strings.TrimSpace }}
{{ $height := .Get "height" | default "180" }}
{{ $srcDoc := printf "<!doctype html><html><head><meta charset='utf-8'><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:1rem;background:#fff;color:#222}</style></head><body>%s</body></html>" $code }}
<div class="demo-block">
  <div class="demo-preview">
    <iframe
      srcdoc="{{ $srcDoc }}"
      frameborder="0"
      class="demo-iframe"
      style="height:{{ $height }}px"
      loading="lazy"
    ></iframe>
  </div>
  <details class="demo-source">
    <summary>View code</summary>
    {{ highlight $code "html" "" }}
  </details>
</div>
