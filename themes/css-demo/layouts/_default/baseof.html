<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
    <span class="site-tagline">hands-on reference</span>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      {{ $sprite := resources.Get "icons.svg" }}
      {{ if $sprite }}
      <svg class="icon icon-sun"  width="1.1em" height="1.1em" aria-hidden="true"><use href="{{ $sprite.RelPermalink }}#icon-sun"></use></svg>
      <svg class="icon icon-moon" width="1.1em" height="1.1em" aria-hidden="true"><use href="{{ $sprite.RelPermalink }}#icon-moon"></use></svg>
      {{ end }}
    </button>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <p class="nav-label">Topics</p>
      <ul>
        <li><a href="{{ "/" | relURL }}" {{ if .IsHome }}class="active"{{ end }}>Home</a></li>
        {{ $topics := where .Site.RegularPages "Section" "topics" }}
        {{ range $topics.ByParam "weight" }}
        <li>
          <a href="{{ .Permalink }}"{{ if eq $.RelPermalink .RelPermalink }} class="active"{{ end }}>
            {{ .Title }}
          </a>
        </li>
        {{ end }}
      </ul>
    </nav>

    <main class="content">
      {{ block "main" . }}{{ end }}
    </main>
  </div>

  <footer class="site-footer">
    © {{ now.Year }} <a href="https://github.com/MPZ-00">MPZ-00</a> · Licensed under AGPL-3.0
  </footer>

  <script>
    (function () {
      const root = document.documentElement;
      const btn  = document.getElementById('themeToggle');

      const IFRAME_COLORS = {
        dark:  { bg: '#1a1730', fg: '#e8e4ff' },
        light: { bg: '#ffffff', fg: '#222222' },
      };

      // override the CSS vars injected by the demo shortcode
      // --ds-muted: #c0b8e8 on #1a1730 = ~9.4:1 contrast (AAA)
      const DARK_IFRAME_CSS =
        ':root{--ds-bg:#1a1730;--ds-surface:#2d2a45;--ds-surface-alt:#2a1f4a;' +
        '--ds-border:#2d2a45;--ds-muted:#c0b8e8;--ds-text:#e8e4ff}';

      function paintIframes(t) {
        const c = IFRAME_COLORS[t];
        document.querySelectorAll('.demo-iframe').forEach(function (f) {
          function paint() {
            try {
              const doc = f.contentDocument || f.contentWindow.document;
              if (!doc || !doc.body) return;
              doc.body.style.background = c.bg;
              doc.body.style.color      = c.fg;
              var el = doc.getElementById('__dm');
              if (!el) {
                el = doc.createElement('style');
                el.id = '__dm';
                doc.head.appendChild(el);
              }
              el.textContent = t === 'dark' ? DARK_IFRAME_CSS : '';
            } catch (_) {}
          }
          if (f.contentDocument && f.contentDocument.readyState === 'complete') {
            paint();
          } else {
            f.addEventListener('load', paint, { once: true });
          }
        });
      }

      function applyTheme(t) {
        root.setAttribute('data-theme', t);
        localStorage.setItem('theme', t);
        paintIframes(t);
      }

      const saved = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      applyTheme(saved);

      btn.addEventListener('click', function () {
        applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });
    })();
  </script>
</body>
</html>
